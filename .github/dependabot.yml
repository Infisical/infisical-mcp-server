---
version: 2

updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      # match min-release-age in .npmrc; security updates are not held back
      cooldown:
          default-days: 7
      groups:
          dev-dependencies:
              dependency-type: development

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
